<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise trading operations desk mockup</title>
  <desc id="desc">A dark enterprise trading dashboard concept with a concise decision strip, primary ICT chart, decision rail, and bottom evidence area.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b121b"/>
      <stop offset="1" stop-color="#070b11"/>
    </linearGradient>
    <linearGradient id="chartBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a24"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .surface { fill:#0f1722; stroke:#253241; stroke-width:1; }
      .surface-2 { fill:#121d29; stroke:#2a3948; stroke-width:1; }
      .muted { fill:#8ea0b4; font-family:Inter, Arial, sans-serif; }
      .text { fill:#e8eef5; font-family:Inter, Arial, sans-serif; }
      .label { fill:#8ea0b4; font-family:Inter, Arial, sans-serif; font-size:14px; font-weight:600; }
      .small { fill:#91a1b3; font-family:Inter, Arial, sans-serif; font-size:12px; }
      .mono { fill:#d8e3ef; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .good { fill:#53d6a5; }
      .warn { fill:#e3b85c; }
      .danger { fill:#ef6f82; }
      .cyan { fill:#5cc9e6; }
      .line { stroke:#2a3948; stroke-width:1; }
      .grid { stroke:#22303d; stroke-width:1; opacity:0.65; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

